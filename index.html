  .font-mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--rosewood);color:white;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#D8D4C8;border-radius:8px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(18,20,31,0.04);}
  .card-hover{transition:transform .25s ease, box-shadow .25s ease;}
  .card-hover:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,20,31,0.08);}

  .btn-primary{background:var(--ink);color:#fff;border-radius:999px;padding:.85rem 1.6rem;font-weight:600;transition:all .2s ease;display:inline-flex;align-items:center;gap:.5rem;}
  .btn-primary:hover{background:var(--rosewood-deep);transform:translateY(-1px);}
  .btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.8rem 1.55rem;font-weight:600;transition:all .2s ease;}
  .btn-secondary:hover{background:var(--ink);color:#fff;}

  .drip{position:absolute;bottom:-6px;width:2px;background:linear-gradient(var(--rosewood), transparent);border-radius:2px;animation:drip 2.6s cubic-bezier(.55,0,.9,.4) infinite;}
  @keyframes drip{0%{height:0;opacity:0;transform:translateY(0);} 15%{opacity:1;} 70%{height:26px;opacity:.9;} 100%{height:26px;opacity:0;transform:translateY(18px);}}

  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);}}
  .pulse-dot{animation:pulseDot 2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .skeleton{background:linear-gradient(90deg,#EFEDE6 25%,#F7F5F0 37%,#EFEDE6 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}

  .nav-item{transition:background .18s ease, color .18s ease;}
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.1);}

  input:focus, button:focus-visible, a:focus-visible{outline:2px solid var(--rosewood); outline-offset:2px;}

  .stitch{background-image:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 0 12px);height:1px;}
  .risk-high{background:#FBE7E9;color:#9E3548;}
  .risk-med{background:#FCF1E1;color:#96712A;}
  .risk-low{background:#E4F0EA;color:#316B52;}
